name: Reconciliation checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: make test
      - run: make demo
      - run: node --check docs/app.js
      - name: Ensure published data matches deterministic demo
        run: git diff --exit-code -- docs/data/demo.json
